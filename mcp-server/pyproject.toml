[project]
name = "turbo-mlx-mcp"
version = "0.1.0"
description = "MCP server exposing turbo-engine (MLX Swift image, video and audio generation) over the local network"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "huggingface_hub>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
turbo-mlx-mcp = "turbo_mlx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbo_mlx_mcp"]
